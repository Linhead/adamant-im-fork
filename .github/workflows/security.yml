name: Security SAST

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

# @see https://typicode.github.io/husky/how-to.html#ci-server-and-docker
env:
  HUSKY: 0

jobs:
  sast:
    name: Run SAST analysis with Semgrep
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to GitHub Security tab
      security-events: write
      contents: read

    steps:
      - name: Checkout repository 🛎️
        uses: actions/checkout@v4

      - name: Run Semgrep 🛡️
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript
            p/vue
            p/owasp-top-ten
            p/secrets
          # Fail the pipeline on findings with severity ERROR or WARNING
          # Remove --severity flag to fail on any finding
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF report to GitHub Security tab 📊
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif